# electron-builder configuration for 3D Gen Studio desktop builds.
# Produces installers for Windows, macOS and Linux.
#
# Prereq: run `npm run build` (vite build → dist/) BEFORE packaging — the
# backend serves dist/ and the packaged app loads it. `npm run dist` does both.
#
# Native modules (sqlite3): electron-builder rebuilds them against Electron's
# ABI automatically (npmRebuild). CI runners have the required build tools; on a
# local machine you need platform build tools (VS Build Tools on Windows,
# Xcode CLT on macOS, build-essential/python3 on Linux).

appId: com.3dgenstudio.app
productName: 3D Gen Studio
copyright: Copyright © 2026 3D Gen Studio

# Consistent, predictable output filenames across every platform and target.
# ${os} = mac | linux | windows, ${arch} = x64 | arm64, ${ext} = the target's
# file extension. This overrides electron-builder's per-target defaults (which
# were producing version-less .exe names and an "app_…_amd64.deb"). Windows'
# two .exe targets get their own names below so they don't collide.
artifactName: 3DGenStudio-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Ad-hoc signs the macOS bundle when no Developer ID is available. Without it
# electron-builder ships a bundle whose Electron-provided signature no longer
# matches its (modified) contents, and macOS refuses it as
# "…is damaged and can't be opened" instead of showing a bypassable warning.
# No-op on Windows/Linux and when a real certificate is present.
afterPack: build/adhoc-sign.cjs

# asar:false keeps files on disk unpacked so the Express backend can require
# its modules and serve dist/ with plain fs paths (no asar path shims).
asar: false

# Explicit include list — the repo has large dirs (.kilo, data/, docs/,
# designs/, python-server/.venv) we must NOT ship. node_modules production
# deps are always included by electron-builder automatically.
files:
  - server.js
  - storage.js
  - wikiStorage.js
  # Read-only log reader mounted by server.js (/api/logs) — the Logs panel is
  # blank-to-broken without it: a missing import kills the whole backend.
  - logs.js
  # glTF pivot placement behind /api/meshes/pivot. Same rule as logs.js: every
  # root-level module server.js imports has to be listed here by name, or the
  # packaged backend dies at startup on ERR_MODULE_NOT_FOUND.
  - meshPivot.js
  # Server-side rig transfer behind /api/meshes/transfer-rig (the MCP transfer_rig
  # tool), and the weight maths it shares with the browser. Same rule as
  # meshPivot.js: root-level modules server.js imports have to be named here.
  - meshRigTransfer.js
  - skinTransfer.js
  # Multi-user server mode. Same rule again: server.js imports all five
  # statically, so omitting any one is an instant ERR_MODULE_NOT_FOUND at
  # startup. auth.js (users/JWT), serverMode.js (which routes exist in which
  # mode), gateway.js (forwards data routes to a shared server), dataStore.js
  # (where a compute result gets written) and uploadQueue.js (its retry spool,
  # reached via dataStore.js rather than imported by server.js directly).
  - auth.js
  - serverMode.js
  - gateway.js
  - dataStore.js
  - uploadQueue.js
  # Self-managed PostgreSQL for a shared server. server.js imports it statically,
  # so it has to ship even though a desktop install never starts it.
  - pgEmbedded.js
  # The SQL engine. storage.js imports db/index.js, which picks a driver at
  # startup: SQLite for this desktop build, PostgreSQL when a shared server sets
  # GENSTUDIO_DATABASE_URL. The whole directory ships because the drivers are
  # loaded by dynamic import — a name-by-name list would look complete and still
  # miss them. db/schema.pg.sql is read at runtime, so it has to travel too.
  - db/**/*
  # MCP automation server (POST /mcp on the backend + stdio bridge).
  - mcp/**/*
  # The VFX contract: document schema, block catalog, compiler and IR. server.js
  # imports it to validate an imported .vfx.json and to build an export bundle,
  # and src/ imports the same modules so the editor and the backend cannot
  # disagree about the format. Same rule as db/ and mcp/: the whole directory
  # ships, because a name-by-name list would look complete and still miss one.
  - vfx/**/*
  - version.json
  - package.json
  # Licences shown in-app. META-LLAMA-3-LICENSE is not documentation: the motion
  # installer displays it and will not proceed until it is accepted, so a missing
  # file would leave Kimodo uninstallable in a packaged build.
  - LICENSE
  - META-LLAMA-3-LICENSE
  - dist/**/*
  - electron/**/*
  # App icon shown on the splash/setup windows (electron/splash.html loads it
  # from disk, so it must ship even though dist/ has its own copy).
  - public/favicon.png
  - comfyui_workflows/**/*
  - setup/**/*
  - tools/**/*
  - wiki/**/*
  # Bundled reference animation library (mesh2motion, MIT) served at /resources:
  # skinned animation GLBs, mp4 clip previews, and the clean skeleton-only rig
  # GLBs used by the Auto Rig → Animations bone-mapping 3D views.
  # Prebuilt motion_correction wheels (foot-skate cleanup). ~360 KB each and they
  # replace a from-source CMake build that needs a C++ compiler, so shipping them is
  # the difference between the feature working and being silently skipped.
  - resources/wheels/**/*
  - resources/animations/**/*
  - resources/animpreviews/**/*
  - resources/rigs/**/*
  - python-server/**/*
  - "!python-server/.venv/**"
  - "!python-server/**/__pycache__/**"
  - "!python-server/*.log"
  # Rigging service (opt-in). Ship the source; the venv + multi-GB model
  # checkpoints are provisioned into the per-user data dir on opt-in, never shipped.
  - thirdparty/skintokens/**/*
  - "!thirdparty/skintokens/.venv/**"
  - "!thirdparty/skintokens/**/__pycache__/**"
  - "!thirdparty/skintokens/experiments/**"
  - "!thirdparty/skintokens/models/**"
  - "!thirdparty/skintokens/tmp_ckpt/**"
  - "!thirdparty/skintokens/tmp_gradio/**"
  - "!thirdparty/skintokens/*.log"
  # Motion generation (opt-in). Same rule as rigging: ship the source, provision
  # the venv and the ~17 GB of weights into the per-user data dir on opt-in.
  - thirdparty/kimodo/**/*
  - "!thirdparty/kimodo/.venv/**"
  - "!thirdparty/kimodo/**/__pycache__/**"
  # Downloads and derived state — the Kimodo checkpoint, the 16 GB Llama-3 base,
  # the embedding cache and the rebased LLM2Vec adapter. All re-created per user.
  - "!thirdparty/kimodo/checkpoints/**"
  - "!thirdparty/kimodo/cache/**"
  - "!thirdparty/kimodo/text-encoder/**"
  - "!thirdparty/kimodo/*.log"
  # CMake build tree from a local MotionCorrection build; rebuilt per install.
  - "!thirdparty/kimodo/MotionCorrection/build/**"
  - "!thirdparty/kimodo/**/*.egg-info/**"
  # Video to motion (opt-in). Ships the service AND the vendored MoCapAnything
  # model source (~8 MB) so nothing is cloned at install time; the venv (which
  # includes the 323 MB bpy wheel) and the 460 MB checkpoint are provisioned
  # into the per-user data dir on opt-in.
  - thirdparty/mocapanything/**/*
  - "!thirdparty/mocapanything/.venv/**"
  - "!thirdparty/mocapanything/**/__pycache__/**"
  # Downloads and derived state, all re-created per user.
  - "!thirdparty/mocapanything/**/checkpoints/**"
  - "!thirdparty/mocapanything/*.log"
  # Scratch trees a dev run leaves behind: the per-rig bake inputs/outputs when
  # MOCAP_DATA_DIR was not set, and the FBX staging folder.
  - "!thirdparty/mocapanything/zoo/**"
  - "!thirdparty/mocapanything/Truebone_Z-OO/**"
  - "!thirdparty/mocapanything/videos/**"
  - "!thirdparty/mocapanything/outputs/**"
  # MAX_PATH. asar:false ships node_modules as real files, and npm nests a
  # duplicate @radix-ui chain inside @excalidraw:
  #   resources/app/node_modules/@excalidraw/excalidraw/node_modules/@radix-ui/
  #   react-tabs/node_modules/@radix-ui/react-roving-focus/node_modules/...
  # Under C:\Program Files\3D Gen Studio (31 chars) the longest path is 251 and
  # everything installs. Under the per-user root, C:\Users\<name>\AppData\Local\
  # Programs\3D Gen Studio (51 for a short name), it is 272 - past the 260-char
  # limit of SHFileOperation, which is what NSIS CopyFiles uses to move the
  # extracted payload into place. Those 6 files fail, and the vendor macro
  # extractUsing7za retries 5x and then reports the appCannotBeClosed string -
  # "3D Gen Studio cannot be closed" - for an app that was never running.
  #
  # @excalidraw is frontend-only: src/pages/BoardPage.jsx imports it and Vite
  # bundles it into dist/. Nothing in server.js / storage.js / mcp requires it,
  # so this copy was dead weight - 801 files, 42 MB. Dropping it takes the
  # longest path to 192, i.e. 68 characters of headroom for longer user names.
  - "!node_modules/@excalidraw/**"
  # HuggingFace download cache from local runs - the models it belongs to are
  # excluded above and provisioned per-user on opt-in.
  - "!thirdparty/skintokens/.cache/**"
  - "!**/*.map"

win:
  icon: public/3dgenstudio.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Distinct from the portable .exe so the two Windows outputs don't collide.
  artifactName: 3DGenStudio-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: 3DGenStudio-Portable-${version}-${arch}.${ext}

mac:
  # TODO: add build/icon.icns for a branded icon (falls back to default now).
  category: public.app-category.graphics-design
  # Apple Silicon only — NOT an arbitrary choice. The Mesh Tools service needs
  # `bpy>=5.0` (requirements.txt) for the GLB→FBX engine export, and Blender 5.x
  # dropped macOS Intel support, so no macosx x86_64 wheel exists. An Intel
  # build installs fine and then fails provisioning its Python venv, which is
  # worse than not shipping it. Revisit if bpy ever ships x86_64 wheels again.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Signing/notarization: set CSC_LINK + CSC_KEY_PASSWORD (Developer ID cert)
  # and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env vars in CI.
  # Without them the build falls back to ad-hoc signing (see afterPack above),
  # which still shows a Gatekeeper warning — but a bypassable one.
  #
  # hardenedRuntime only applies to the real-certificate path; it requires the
  # entitlements below (JIT + library validation off) or the app cannot load
  # sqlite3 / spawn the Python services.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  gatekeeperAssess: false

linux:
  # A .deb package REQUIRES a maintainer (name + email) — without it the fpm
  # target fails. Change this to your preferred contact.
  maintainer: Bruno Fargnoli <info@3dgenstudio.com>
  synopsis: AI-powered 3D mesh production studio
  # TODO: add build/icon.png (512x512) for a branded icon.
  category: Graphics
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Optional auto-update feed. Point at your GitHub releases to enable
# electron-updater later (pairs with your existing version.json flow).
# publish:
#   provider: github
#   owner: visualbruno
#   repo: 3DGenStudio
